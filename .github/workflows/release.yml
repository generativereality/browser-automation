name: Release

# Publishes to npm via OIDC trusted publishing — no NPM_TOKEN, no secret of any
# kind.
#
# Why this exists rather than `npm publish` from a laptop: the credential in a
# developer's `~/.npmrc` is a GRANULAR token, and a granular token is scoped to
# named packages. Publishing this one from a machine whose token was minted for
# a different package fails with a **404 on the PUT** — not a 403, not "you are
# not logged in" — while `npm whoami` still answers with the right username and
# `npm owner ls` still lists you, because both of those are unscoped reads.
# Measured 2026-08-09; `npm profile get` 403ing is the tell that the token is
# granular and narrow.
#
# It is also where npm is going regardless: tokens that bypass 2FA are being
# restricted for account changes (Aug 2026) and for direct publishing
# (Jan 2027). Trusted publishing is unaffected by both, and yields provenance
# attestations that token publishing never did.
#
# ⚠️ **npm trusts this workflow by FILENAME.** Package → Settings → Trusted
# Publisher names `generativereality/browser-automation` + `release.yml`, so
# renaming this file silently breaks releases until npm is updated to match.
#
# Trigger: push a version tag. The tag must match `package.json`, which the job
# verifies before publishing — a mismatch is the classic way to ship a tarball
# that disagrees with its git tag.
#
# Note for whoever pushes the tag: `.github/workflows/*` cannot be pushed over
# an HTTPS remote without the `workflow` OAuth scope. This repo's origin is SSH,
# which sidesteps it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC; without it npm sees no provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # **The release gate.** Pushing a tag no longer publishes; it queues the job and waits for a
    # human to approve it in the Actions UI, because the `release` environment requires a
    # reviewer. There is no way to do this with a step: every step runs unattended, so a job that
    # has started is already too late to ask.
    #
    # This exists because tagging turned out to be the whole release control, and anything that
    # can push a tag could therefore publish — which is exactly what happened on 2026-08-22, when
    # three versions went out inside forty minutes without the maintainer approving any of them.
    # The rule was written down and it was still bypassed, so it is now a gate rather than a rule.
    #
    # ⚠️ Keep the npm Trusted Publisher's "Environment" field set to `release` as well. That makes
    # the gate impossible to remove quietly: a workflow that drops this line no longer matches the
    # OIDC claim npm expects, so it fails to authenticate instead of silently publishing ungated.
    environment: release
    steps:
      - uses: actions/checkout@v4

      # NOTE: deliberately NO `registry-url`.
      #
      # Setting it makes setup-node write an .npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. With no
      # NODE_AUTH_TOKEN secret — which is the whole point of trusted publishing
      # — that expands to setup-node's literal placeholder, and npm then
      # publishes with a credential of `XXXXX-XXXXX-XXXXX-XXXXX` instead of
      # performing the OIDC exchange. The registry rejects it as
      #
      #   npm error code E404
      #   npm error 404 Not Found - PUT .../@generativereality%2fbrowser-automation
      #
      # which reads as "the package does not exist" and sends you to check
      # names, scopes and permissions. It is an auth failure wearing a 404, and
      # it is the same misleading shape the file header already warns about for
      # granular tokens — arrived at here by the opposite route. The tell is
      # that the run log shows no OIDC or provenance lines at all: npm never
      # tried, because it thought it already had a credential.
      #
      # Without registry-url there is no .npmrc and npm falls back to the
      # default registry with no credential.
      #
      # ⚠️ **That alone did not make the publish work**, and the file should say
      # so rather than imply a fix. Measured over the workflow's first two runs
      # (2026-08-22, v0.4.8):
      #
      #   with registry-url     npm error code E404      (published with the placeholder)
      #   without registry-url  npm error code ENEEDAUTH (no credential at all)
      #
      # Neither run shows a single OIDC or provenance line, so npm never
      # attempted the exchange in either configuration. Removing the placeholder
      # was necessary — a bogus credential would have pre-empted OIDC — but the
      # remaining blocker is on npm's side, not in this file: the package needs
      # a Trusted Publisher configured at npmjs.com naming
      # `generativereality/browser-automation` + `release.yml`. Until that
      # exists there is nothing for the exchange to authenticate against, and
      # ENEEDAUTH is the honest symptom of it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      # Trusted publishing needs npm >= 11.5.1; setup-node still ships older.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }

      # typecheck + the one-place-decides-the-port guard + build. `prepack` runs
      # the build again at publish time; this is here so a failure is reported
      # against the check rather than buried in the publish step.
      - name: Check
        run: npm run check

      - name: Publish to npm
        run: npm publish
